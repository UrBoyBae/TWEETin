<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWEETin</title>
    <link rel="icon" href="./asset/svg/tweetin-logo.svg" type="image/x-icon">
    <!-- Link CSS -->
    <link rel="stylesheet" href="./asset/css/main.css">
    <!-- Link Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Link Google Icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=finance_mode,search,task_alt" />
</head>

<!-- Container -->
<body class="container">
    <!-- Navbar -->
    <div class="group-navbar-menubar">
        <div class="navbar">
            <div class="title-app">
                <img src="./asset/svg/tweetin-logo.svg" alt="logo">
                <a href="" class="title">TWEETin</a>
            </div>
            <div class="menubar">
                <a href="" class="menu">HOME</a>
                <a href="#card-new-tweet" class="menu">POST</a>
            </div>
            <div class="search-bar">
                <input type="text" id="search-bar" placeholder="Search Title" />
                <button class="btn-search" id="btn-search">
                    <span class="material-symbols-rounded">
                        search
                    </span>
                </button>
            </div>
        </div>
        <div class="menubar-mobile-view">
            <a href="" class="menu">HOME</a>
            <a href="#card-new-tweet" class="menu">POST</a>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="left"></div>
        <div class="center">
            <!-- Card New Tweet -->
            <div class="card-new-tweet" id="card-new-tweet">
                <form id="form-new-tweet">
                    <div class="input-username-tweet">
                        <img src="./asset/images/user.png" alt="user">
                        <input type="text" name="input-username-tweet" id="input-username-tweet" placeholder="Username..." required>
                        <p id="username-tweet-length"></p>
                    </div>
                    <div class="group-title-tweet">
                        <input type="text" name="input-title-tweet" id="input-title-tweet" class="input-title-tweet" placeholder="Title..." required>
                        <p id="title-tweet-length"></p>
                    </div>
                    <textarea name="input-content-tweet" id="input-content-tweet" class="input-content-tweet" placeholder="Content..." required></textarea>
                    <div class="group-submit">
                        <div class="progress-donut">
                            <span id="content-tweet-length">300</span>
                        </div>
                        <button type="submit" class="btn-post" id="btn-post">Posting</button>
                    </div>
                </form>
            </div>
            <!-- Search Bar -->
            <div class="search-bar-mobile-view">
                <input type="text" id="search-bar-mobile-view" placeholder="Search Title" />
                <button class="btn-search-mobile-view" id="btn-search-mobile-view">
                    <span class="material-symbols-rounded">
                        search
                    </span>
                </button>
            </div>
            <!-- All Tweet -->
            <div class="all-tweet" id="all-tweet"></div>
        </div>
        <div class="right">
            <div class="card-total-tweet">
                <div class="card-total-tweet-left">
                    <span class="total-tweet-title">Total Tweet</span>
                    <span class="total-tweet" id="total-tweet">100 Tweet</span>
                </div>
                <div class="card-total-tweet-right">
                    <span class="material-symbols-rounded">
                        finance_mode
                    </span>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast">
            <span class="material-symbols-rounded">
                task_alt
            </span>
            <span class="toast-message" id="toast-message"></span>
        </div>
    </div>

    <!-- Link JS -->
    <script src="./asset/js/main.js"></script>
</body>
</html>
